; Glide portable settings. Keep this file beside Glide.exe in a writable folder.
; Controller = the PC with your mouse and keyboard. Receiver = the other PC.
; RemoteSide is Left or Right, as viewed from the controlling PC.
; Pairing credentials are added here using Windows account-bound encryption.
[Glide]
Role=Controller
PeerAddress=
RemoteSide=Right
PeerCredential=
ReceiverIdentity=
PeerName=
AutoConnect=True
DiscoveryEnabled=True
